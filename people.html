
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People</title>

    <style>
        body {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            background: #0b0b0b;
            color: #f5f5f5;
            line-height: 1.7;
        }

        .navigation {
            padding: 90px 90px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home-button {
            color: #f5f5f5;
            text-decoration: none;
            border: 1px solid #555;
            padding: 10px 18px;
            border-radius: 3px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 0px;
        }

        .home-button:hover {
            background: #f5f5f5;
            color: #0b0b0b;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0px 30px 80px;
        }

         .section-label {
            font-size: 32px;
            font-weight: 500;
            margin-top: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 58px;
            font-weight: 500;
            line-height: 1.1;
            margin: 0 0 25px;
        }

        .intro {
            font-size: 23px;
            color: hwb(0 100% 0%);
            line-height: 1.6;
            margin-bottom: 60px;
            text-align: center;
        }

        h2 {
            font-size: 32px;
            font-weight: 500;
            margin-top: 65px;
            margin-bottom: 30px;
            text-align: center;
        }

        .people-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
        }

        .additional-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            height: 150px;
            width: 700px;
            margin: 0 auto;
        }

        .person-image {
            width: 100%;
            height: 150px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            transition: opacity 0.2s ease;
        }

        .person-image:hover {
            opacity: 0.7;
        }

        .bottom-navigation {
            text-align: center;
            margin-top: 80px;
            padding-top: 30px;
        }

        @media (max-width: 900px) {
            .people-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .additional-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 40px;
            }

            .intro {
                font-size: 19px;
            }

            h2 {
                font-size: 27px;
            }

            .people-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .additional-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            main {
                padding-left: 20px;
                padding-right: 20px;
            }
        }
    </style>
</head>

</html>
